on:
  workflow_dispatch:
  push:
    branches:
      - v3
  pull_request:
    branches:
      - v3

jobs:
  build-frontend:
    runs-on: ubuntu-24.04
    steps:
      - name: Get source code
        uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          cd frontend
          bun install
      - name: Build frontend
        run: |
          cd frontend
          bun run build
      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/
          retention-days: 1
  build-docker:
    needs: build-frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Architecture matrix
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm64
            arch: arm64
        variant: [ checker, orchestrator, api, aio ]
    steps:
      - name: Get source code
        uses: actions/checkout@v5
      - name: Download frontend artifacts
        uses: actions/download-artifact@v5
        with:
          name: frontend-build
          path: frontend/
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/checkmate:${{ matrix.variant }}-${{ matrix.arch }}
          context: .
          file: ./docker/Dockerfile.ci
          build-args: |
            GO_ENTRYPOINT=cmd/${{ matrix.variant }}.go
          platforms: linux/${{ matrix.arch }}
  create-manifests:
    if: github.event_name != 'pull_request'
    needs: build-docker
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        variant: [ checker, orchestrator, api, aio ]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create and push multi-arch manifest
        run: |
          docker manifest create ${{ secrets.DOCKERHUB_USERNAME }}/checkmate:${{ matrix.variant }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/checkmate:${{ matrix.variant }}-amd64 \
            ${{ secrets.DOCKERHUB_USERNAME }}/checkmate:${{ matrix.variant }}-arm64
          docker manifest push ${{ secrets.DOCKERHUB_USERNAME }}/checkmate:${{ matrix.variant }}
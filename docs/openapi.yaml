          allOf:
          - $ref: "#/components/schemas/github_com_bartosz11_checkmate_common_database_model.TargetType"
          description: Type must be 0 (PING) or 1 (HTTP)
          type: object
      required:
      - checkerIDs
      - name
      type: object
    api_handlers_target.HTTPInfoCreateRequest:
      properties:
        allowedCodes:
          description: HTTP response codes separated by a space. Must contain at least
            one code. All codes must be exactly 3 digits long.

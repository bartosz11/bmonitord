          type: boolean
        host:
          description: Host must start with http:// or https://
          type: string
        verifySSLCert:
          type: boolean
      required:
      - allowedCodes
      - followRedirects
      - host
      - verifySSLCert
      type: object
    api_handlers_target.HTTPInfoUpdateRequest:

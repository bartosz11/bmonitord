                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when a checker with given ID couldn't be found.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when a DB interaction fails.
      security:
      - BearerAuth: []
      summary: Delete a checker
      tags:
      - checker
    get:
      description: "Allows a user to get a checker by its ID, includes key if user\
        \ has admin privileges"
      parameters:
      - description: ID of checker that should be retrieved
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/checker.getCheckerSuccessResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when given ID couldn't be parsed.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when user sending the request supplies an invalid
            auth token.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when account of user sending the request is disabled.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when a checker with given ID couldn't be found.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when a DB interaction fails.
      security:
      - BearerAuth: []
      summary: Get a checker by ID
      tags:
      - checker
    patch:
      description: Allows an admin to change checker's name or location
      parameters:
      - description: ID of checker that should be updated
        in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/checker.UpdateCheckerRequest"
        description: New checker details
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/checker.getCheckerSuccessResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when given ID couldn't be parsed or given new name

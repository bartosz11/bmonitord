      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/checker.listCheckersSuccessResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"

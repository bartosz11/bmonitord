        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when account of user sending the request is disabled.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when a DB interaction fails.
      security:
      - BearerAuth: []
      summary: Get all checkers
      tags:
      - checker
    post:
      description: Allows an admin to create a checker
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/checker.CreateCheckerRequest"
        description: Data required to create a new checker
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/checker.createCheckerSuccessResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when request body does not match the requirements.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when user sending the request supplies an invalid
            auth token.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when user sending the request is not an admin or their
            account is disabled.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when a DB interaction fails.
      security:
      - BearerAuth: []
      summary: Create a new checker
      tags:
      - checker
      x-codegen-request-body-name: checkerInfo
  /checker/{id}:
    delete:

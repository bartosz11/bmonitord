        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_bartosz11_checkmate_api_helpers.GenericErrorResponse"
          description: Returned when a checker with given ID couldn't be found.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_bartosz11_checkmate_api_helpers.GenericErrorResponse"
          description: Returned when a DB interaction fails.
      security:
      - BearerAuth: []
      summary: Delete a checker
      tags:
      - checker
    get:
      description: "Allows a user to get a checker by its ID, includes key if user\
        \ has admin privileges"
      parameters:
      - description: ID of checker that should be retrieved
        in: path
        name: id
        required: true

        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when a DB interaction fails.
      security:
      - BearerAuth: []
      summary: Re-generate checker's key
      tags:
      - checker
  /notification/:

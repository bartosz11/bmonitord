        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when user sending the request supplies an invalid
            auth token.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when user sending the request is not an admin or their
            account is disabled.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when a checker with given ID couldn't be found.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when a DB interaction fails.
      security:
      - BearerAuth: []
      summary: Update checker details
      tags:
      - checker
      x-codegen-request-body-name: checkerInfo
  /checker/{id}/key:

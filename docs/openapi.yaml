        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_bartosz11_checkmate_api_helpers.GenericErrorResponse"
          description: Returned when a setting with given key couldn't be found.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_bartosz11_checkmate_api_helpers.GenericErrorResponse"
          description: Returned when a DB interaction fails.
      security:
      - BearerAuth: []
      summary: Get setting by key
      tags:
      - settings
  /auth/login:
    post:
      description: Allows a user with valid credentials to create a new login session
        and a token.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api_handlers_auth.Credentials"
        description: Valid credentials of user who wants to create a new session
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api_handlers_auth.loginSuccessResponse"
          description: OK
          headers:
            Set-Cookie:
              description: Authentication cookie (auth-token=...)
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_bartosz11_checkmate_api_helpers.GenericErrorResponse"
          description: Returned when request body does not match the requirements.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_bartosz11_checkmate_api_helpers.GenericErrorResponse"
          description: Returned when supplied credentials are invalid.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_bartosz11_checkmate_api_helpers.GenericErrorResponse"
          description: Returned when the user account is disabled.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_bartosz11_checkmate_api_helpers.GenericErrorResponse"
          description: Returned when a DB interaction or token generation fails.
      summary: Log in
      tags:
      - auth
      x-codegen-request-body-name: credentials
  /auth/register:
    post:
      description: Allows a user to create a new account with the supplied credentials
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api_handlers_auth.Credentials"
        description: Username and password for the new user account
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api_handlers_auth.registerSuccessResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_bartosz11_checkmate_api_helpers.GenericErrorResponse"
          description: Returned when request body does not match the requirements.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_bartosz11_checkmate_api_helpers.GenericErrorResponse"
          description: Returned when supplied credentials are invalid.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_bartosz11_checkmate_api_helpers.GenericErrorResponse"
          description: Returned when registration is disabled.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_bartosz11_checkmate_api_helpers.GenericErrorResponse"
          description: Returned when specified username is already taken.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_bartosz11_checkmate_api_helpers.GenericErrorResponse"
          description: Returned when a DB interaction or password hashing fails.
      summary: Register
      tags:
      - auth
      x-codegen-request-body-name: credentials
  /checker/:
    get:
      description: "Allows a user to get list of all checkers, includes keys if requesting\
        \ user has admin privileges"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api_handlers_checker.listCheckersSuccessResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_bartosz11_checkmate_api_helpers.GenericErrorResponse"
          description: Returned when user sending the request supplies an invalid
            auth token.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_bartosz11_checkmate_api_helpers.GenericErrorResponse"
          description: Returned when account of user sending the request is disabled.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_bartosz11_checkmate_api_helpers.GenericErrorResponse"
          description: Returned when a DB interaction fails.
      security:
      - BearerAuth: []
      summary: Get all checkers
      tags:
      - checker
    post:
      description: Allows an admin to create a checker
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api_handlers_checker.CreateCheckerRequest"
        description: Data required to create a new checker
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api_handlers_checker.createCheckerSuccessResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_bartosz11_checkmate_api_helpers.GenericErrorResponse"
          description: Returned when request body does not match the requirements.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_bartosz11_checkmate_api_helpers.GenericErrorResponse"
          description: Returned when user sending the request supplies an invalid
            auth token.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_bartosz11_checkmate_api_helpers.GenericErrorResponse"
          description: Returned when user sending the request is not an admin or their
            account is disabled.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_bartosz11_checkmate_api_helpers.GenericErrorResponse"
          description: Returned when a DB interaction fails.
      security:
      - BearerAuth: []
      summary: Create a new checker
      tags:
      - checker
      x-codegen-request-body-name: checkerInfo
  /checker/{id}:
    delete:

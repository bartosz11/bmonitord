            application/json:
              schema:
                $ref: "#/components/schemas/github_com_bartosz11_checkmate_api_helpers.GenericErrorResponse"
          description: Returned when a DB interaction fails.
      security:
      - BearerAuth: []
      summary: Get a checker by ID
      tags:
      - checker
    patch:
      description: Allows an admin to change checker's name or location
      parameters:
      - description: ID of checker that should be updated
        in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api_handlers_checker.UpdateCheckerRequest"
        description: New checker details
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api_handlers_checker.getCheckerSuccessResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_bartosz11_checkmate_api_helpers.GenericErrorResponse"

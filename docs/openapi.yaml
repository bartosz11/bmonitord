openapi: 3.0.1
info:
  contact: {}
  description: API docs for checkmate
  title: checkmate API
  version: "1.0"
servers:
- url: //localhost:8080/api
paths:
  /admin/orchestrator/:
    get:
      description: Allows an admin to get a list of all orchestrators
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/orchestrator.listOrchestratorsSuccessResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when user sending the request supplies an invalid
            auth token.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when user sending the request is not an admin or their
            account is disabled.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when a DB interaction fails.
      security:
      - BearerAuth: []
      summary: Get all orchestrators
      tags:
      - orchestrator
    post:
      description: Allows an admin to create a new orchestrator
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/orchestrator.CreateOrchestratorRequest"
        description: Information about new orchestrator
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/orchestrator.createOrchestratorSuccessResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when request body doesn't match requirements.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when user sending the request supplies an invalid
            auth token.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when user sending the request is not an admin or their
            account is disabled.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when given name or host is already taken.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when a DB interaction fails.
      security:
      - BearerAuth: []
      summary: Create orchestrator
      tags:
      - orchestrator
      x-codegen-request-body-name: createRequest
  /admin/orchestrator/{id}:
    delete:
      description: Allows an admin to delete an orchestrator with given ID
      parameters:
      - description: ID of orchestrator that should get deleted
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "204":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericDeleteSuccessResponse"
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: "Returned when given ID couldn't be parsed, specified orchestrator\
            \ is currently leader or is a system orchestrator."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when user sending the request supplies an invalid
            auth token.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when user sending the request is not an admin or their
            account is disabled.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when orchestrator with given ID couldn't be found.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when a DB interaction fails.
      security:
      - BearerAuth: []
      summary: Delete orchestrator
      tags:
      - orchestrator
    get:
      description: Allows an admin to retrieve an orchestrator with given ID
      parameters:
      - description: ID of orchestrator to get
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/orchestrator.getOrchestratorSuccessResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when given ID couldn't be parsed.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when user sending the request supplies an invalid
            auth token.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when user sending the request is not an admin or their
            account is disabled.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when orchestrator with given ID couldn't be found.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when a DB interaction fails.
      security:
      - BearerAuth: []
      summary: Get orchestrator by ID
      tags:
      - orchestrator
  /admin/settings/:
    get:
      description: Allows an admin to retrieve list of all settings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/settings.listSettingsSuccessResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when user sending the request supplies an invalid
            auth token.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when user sending the request is not an admin or their
            account is disabled.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when a DB interaction fails.
      security:
      - BearerAuth: []
      summary: Get all settings
      tags:
      - settings
    post:
      description: Allows an admin to set/update a setting
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/settings.ChangeSettingRequest"
        description: Setting to update
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/settings.getSettingSuccessResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when request body is malformed or value isn't valid
            for given setting key.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when user sending the request supplies an invalid
            auth token.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: "Returned when user sending the request is not an admin, their\
            \ account is disabled or specified setting is not meant to be updated."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when a DB interaction fails.
      security:
      - BearerAuth: []
      summary: Set/modify setting value
      tags:
      - settings
      x-codegen-request-body-name: changeRequest
  /admin/settings/{key}:
    get:
      description: Allows an admin to retrieve a setting by key
      parameters:
      - description: Setting to retrieve
        in: path
        name: key
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/settings.getSettingSuccessResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when user sending the request supplies an invalid
            auth token.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when user sending the request is not an admin or their
            account is disabled.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when a setting with given key couldn't be found.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when a DB interaction fails.
      security:
      - BearerAuth: []
      summary: Get setting by key
      tags:
      - settings
  /auth/login:
    post:
      description: Allows a user with valid credentials to create a new login session
        and a token.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/auth.Credentials"
        description: Valid credentials of user who wants to create a new session
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/auth.loginSuccessResponse"
          description: OK
          headers:
            Set-Cookie:
              description: Authentication cookie (auth-token=...)
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when request body does not match the requirements.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when supplied credentials are invalid.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when the user account is disabled.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when a DB interaction or token generation fails.
      summary: Log in
      tags:
      - auth
      x-codegen-request-body-name: credentials
  /auth/register:
    post:
      description: Allows a user to create a new account with the supplied credentials
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/auth.Credentials"
        description: Username and password for the new user account
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/auth.registerSuccessResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when request body does not match the requirements.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when supplied credentials are invalid.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when registration is disabled.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when specified username is already taken.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helpers.GenericErrorResponse"
          description: Returned when a DB interaction or password hashing fails.
      summary: Register
      tags:
      - auth
      x-codegen-request-body-name: credentials
  /checker/:
    get:
      description: "Allows a user to get list of all checkers, includes keys if requesting\

          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_bartosz11_checkmate_api_helpers.GenericErrorResponse"
          description: Returned when given ID couldn't be parsed.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/github_com_bartosz11_checkmate_api_helpers.GenericErrorResponse"
          description: Returned when user sending the request supplies an invalid

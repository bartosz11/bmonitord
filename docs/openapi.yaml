          items:
            type: integer
          type: array
        httpInfo:
          allOf:
          - $ref: "#/components/schemas/target.HTTPInfoCreateRequest"
          description: Must be supplied if type is 1 (HTTP)
          type: object
        maxRetries:
          description: "Max retries is required, ignored in case of agents"
          type: integer
        name:
          description: Name must not be blank
          type: string
        pingInfo:
          allOf:
          - $ref: "#/components/schemas/target.PingInfoCreateRequest"
          description: Must be supplied if type is 0 (PING)
          type: object
        timeout:
          description: Timeout is required
          type: integer
        type:
          allOf:
          - $ref: "#/components/schemas/model.TargetType"
          description: "Type must be 0 (PING), 1 (HTTP) or 2 (AGENT)"
          type: object
      required:
      - checkerIDs
      - name
      type: object
    target.HTTPInfoCreateRequest:
      properties:
        allowedCodes:
          description: HTTP response codes separated by a space. Must contain at least
            one code. All codes must be exactly 3 digits long.
          type: string
        followRedirects:
          type: boolean
        host:
          description: Host must start with http:// or https://
          type: string
        verifySSLCert:
          type: boolean
      required:
      - allowedCodes
      - followRedirects
      - host
      - verifySSLCert
      type: object
    target.HTTPInfoUpdateRequest:
      properties:
        allowedCodes:
          description: HTTP response codes separated by a space. Must contain at least
            one code if supplied. All codes must be exactly 3 digits long.
          type: string
        followRedirects:
          type: boolean
        host:
          description: Host must start with http:// or https:// if supplied
          type: string
        verifySSLCert:
          type: boolean
      type: object
    target.PingInfoCreateRequest:
      properties:
        host:
          description: Host must not be blank
          type: string
      required:
      - host
      type: object
    target.PingInfoUpdateRequest:
      properties:
        host:
          description: Host must not be blank if pingInfo is supplied in UpdateTargetRequest
          type: string
      type: object

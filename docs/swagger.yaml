      severity:
        allOf:
        - $ref: '#/definitions/model.StatuspageNoticeSeverity'
        description: Severity is optional. Notices of type announcement (2) must use
          severity "none" (0)
      startedAt:
        description: StartedAt is optional, must be before ResolvedAt if its value
          isn't empty in the request or in the notice
        type: string
      targets:
        description: TargetIDs are optional. If provided, they replace the current
          target list. All specified targets must belong to the same statuspage as
          the notice.
        items:
          type: integer
        type: array
      title:
        description: Title is optional, must not be empty if provided
        type: string
    type: object

basePath: /api
definitions:
  alarm.CreateAlarmRequest:
    properties:
      maxRetries:
        description: Max retries is required, ignored in case of agents
        type: integer
      name:
        description: Name must not be blank
        type: string
      notificationIDs:
        description: All notifications in this list must exist
        items:
          type: integer
        type: array
      threshold:
        description: Threshold must be supplied if type is 1 (threshold)
        type: number
      thresholdField:
        allOf:
        - $ref: '#/definitions/model.AlarmThresholdField'
        description: Threshold field must be supplied if type is 1 (threshold). At
          the moment the only accepted value is 0 (latency)
      thresholdFieldParams:
        description: Threshold field params must be supplied if type is 1 (threshold).
          Used to specify when to trigger alarms in some cases, can be left blank
          though
        type: string
      type:
        allOf:
        - $ref: '#/definitions/model.AlarmType'
        description: Type must be 1 (threshold). This is left in place for possible
          future use
    required:
    - name
    - notificationIDs
    type: object
  alarm.UpdateAlarmRequest:
    properties:
      maxRetries:
        type: integer
      name:
        description: Name must not be blank if supplied
        type: string
      notificationIDs:
        description: min. length = 1 if supplied, all notifications must exist. This
          is a "replace update"
        items:
          type: integer
        type: array
      threshold:
        description: Must be supplied if type is getting changed to threshold (1)
        type: number
      thresholdField:
        allOf:
        - $ref: '#/definitions/model.AlarmThresholdField'
        description: Must be supplied if type is getting changed to threshold (1),
          at the moment the only accepted value is 0 (latency)
      thresholdFieldParams:
        description: Threshold field params must be supplied if type is getting changed
          to 1 (threshold). Used to specify when to trigger alarms in some cases,
          can be left blank though
        type: string
      type:
        allOf:
        - $ref: '#/definitions/model.AlarmType'
        description: Type must be 1 (threshold), if supplied. This is left in place
          for possible future use
    type: object
  alarm.createAlarmSuccessResponse:
    properties:
      code:
        example: 201
        type: integer
      data:
        $ref: '#/definitions/model.Alarm'
    type: object
  alarm.getAlarmSuccessResponse:
    properties:
      code:
        example: 200
        type: integer
      data:
        $ref: '#/definitions/model.Alarm'
    type: object
  alarm.listAlarmsSuccessResponse:

          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "404":
          description: Returned when a heartbeat with given ID couldn't be found or
            user sending the request isn't allowed to access it (target isn't public).
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "500":
          description: Returned when a DB interaction fails.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'

  statuspage.CreateStatuspageRequest:
    properties:
      description:
        description: Description is displayed below the title, it's optional
        type: string
      displayCheckmateFooter:
        description: DisplayCheckmateFooter specifies whether a "Powered by checkmate"
          footer is displayed at the bottom of the page.
        type: boolean
      footerContent:
        description: FooterContent is the text displayed in the footer area, it's
          optional
        type: string
      logoURL:
        description: LogoURL's value is used to display a logo left of the title,
          it's optional
        type: string
      name:
        description: Name is only displayed in the dashboard, must not be blank
        type: string
      slug:
        description: |-
          Slug is used to route viewers to statuspages. Given slug must not be used across this instance already.
          A slug is deemed invalid if it is empty, starts or ends with a hyphen, contains characters other than lowercase letters, digits, or hyphens, or includes consecutive hyphens.
        type: string
      title:
        description: Title is displayed on top of the statuspage, must not be blank
        type: string
      titleSectionOnClickURL:
        description: TitleSectionOnClickURL's value is where the title section (title
          and logo) will redirect when the user clicks on it. If not supplied, clicking
          will do nothing
        type: string
    required:
    - name
    - slug
    - title
    type: object
  statuspage.UpdateStatuspageRequest:
    properties:
      description:
        description: Description is displayed below the title, can be blank to reset
        type: string
      displayCheckmateFooter:
        description: DisplayCheckmateFooter specifies whether a "Powered by checkmate"
          footer is displayed at the bottom of the page.
        type: boolean
      footerContent:
        description: FooterContent is the text displayed in the footer area, can be
          blank to reset
        type: string
      logoURL:
        description: LogoURL's value is used to display a logo left of the title,
          can be blank to reset
        type: string
      name:
        description: Name is only displayed in the dashboard, must not be blank if
          provided
        type: string
      slug:
        description: |-
          Slug is used to route viewers to statuspages. Given slug must not be used across this instance already. Must not be blank if provided
          A slug is deemed invalid if it is empty, starts or ends with a hyphen, contains characters other than lowercase letters, digits, or hyphens, or includes consecutive hyphens.
        type: string
      title:
        description: Title is displayed on top of the statuspage, must not be blank
          if provided
        type: string
      titleSectionOnClickURL:
        description: TitleSectionOnClickURL's value is where the title section (title
          and logo) will redirect when the user clicks on it. Clicking will do nothing
          if this value is empty. Can be set to an empty string to reset.
        type: string
    type: object

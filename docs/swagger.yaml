  /heartbeat/{id}/last:
    get:
      consumes:
      - application/json
      description: Allows to retrieve information about the last heartbeat of target
        with specified ID, if target is public then the info can be retrieved by anyone,
        even without an auth token
      parameters:
      - description: ID of target to get the last heartbeat info of
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:

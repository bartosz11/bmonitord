    - host
    - verifySSLCert
    type: object
  target.HTTPInfoUpdateRequest:
    properties:
      allowedCodes:
        description: HTTP response codes separated by a space. Must contain at least
          one code if supplied. All codes must be exactly 3 digits long.
        type: string
      followRedirects:
        type: boolean
      host:
        description: Host must start with http:// or https:// if supplied
        type: string
      verifySSLCert:
        type: boolean
    type: object
  target.PingInfoCreateRequest:
    properties:
      host:
        description: Host must not be blank
        type: string
    required:
    - host
    type: object
  target.PingInfoUpdateRequest:
    properties:
      host:
        description: Host must not be blank if pingInfo is supplied in UpdateTargetRequest
        type: string
    type: object
  target.ReportData:
    properties:
      incidentHistory:
        description: IncidentHistory contains incidents from last 30 days
        items:
          $ref: '#/definitions/model.Incident'
        type: array
      lastHeartbeatsFromLocations:
        description: LastHeartbeatsFromLocations contains most recent heartbeats from
          all locations, one per location or the last heartbeat if target is of a
          type that's push
        items:
          $ref: '#/definitions/model.Heartbeat'
        type: array
      target:
        allOf:
        - $ref: '#/definitions/model.Target'
        description: Target is the target the report was requested for
      uptime:
        allOf:
        - $ref: '#/definitions/target.UptimeData'
        description: Uptime contains pre-computed uptime percentages for various time
          periods based on incidents in these time periods
    type: object
  target.UpdateTargetRequest:
    properties:
      checkerIDs:
        description: Must contain at least one checker ID, all checkers must exist.
          This is a "replace update". This is ignored if Target's type is 2 (AGENT)
        items:
          type: integer
        type: array
      httpInfo:
        $ref: '#/definitions/target.HTTPInfoUpdateRequest'
      name:
        description: Name must not be blank if supplied
        type: string
      pingInfo:
        $ref: '#/definitions/target.PingInfoUpdateRequest'
      timeout:
        type: integer
    type: object
  target.UptimeData:
    properties:
      last_7d:

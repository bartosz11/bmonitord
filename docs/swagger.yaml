    type: object
  statuspage_target.listStatuspageTargetsSuccessResponse:
    properties:
      code:
        example: 200
        type: integer
      data:
        items:
          $ref: '#/definitions/model.StatuspageTarget'
        type: array
    type: object
  target.CreateTargetRequest:
    properties:
      checkerIDs:
        description: At least one checker must be supplied if type is 0 or 1, all
          checkers must exist, if given type is 2 this is ignored
        items:
          type: integer
        type: array
      httpInfo:
        allOf:
        - $ref: '#/definitions/target.HTTPInfoCreateRequest'
        description: Must be supplied if type is 1 (HTTP)
      name:
        description: Name must not be blank
        type: string
      pingInfo:
        allOf:
        - $ref: '#/definitions/target.PingInfoCreateRequest'
        description: Must be supplied if type is 0 (PING)
      timeout:
        description: Timeout is required
        type: integer
      type:
        allOf:
        - $ref: '#/definitions/model.TargetType'
        description: Type must be 0 (PING), 1 (HTTP) or 2 (AGENT)
    required:
    - checkerIDs
    - name
    type: object
  target.GetIncidentPageSuccessResponse:
    properties:
      code:
        example: 200
        type: integer
      data:
        $ref: '#/definitions/helpers.Page-model_Incident'
    type: object
  target.GetManyIncidentsSuccessResponse:
    properties:
      code:
        example: 200
        type: integer
      data:
        items:
          $ref: '#/definitions/model.Incident'
        type: array

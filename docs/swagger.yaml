        "500":
          description: Returned when a DB interaction fails.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
      summary: Get last heartbeat of target
      tags:
      - heartbeat
  /heartbeat/{id}/page:
    get:
      consumes:
      - application/json
      description: Allows to retrieve a page of heartbeats of a target, if target
        is public then the info can be retrieved by anyone, even without an auth token.
        This endpoint may return empty pages if target is not public.
      parameters:
      - description: ID of target to get the page of heartbeats for
        in: path
        name: id
        required: true
        type: integer
      - description: Size of the page, has to be a number in range [1, 200]. If value
          smaller or equal to 0 is given it defaults to 20. If value higher than 200
          is given, 200 is used.
        in: query
        name: size
        type: integer
      - description: Page number, if a negative number is given it defaults to 0.
        in: query
        name: page
        type: integer
      - description: 'Sorting settings. Format: <field>,<direction> where field can
          be one of: (latency, timestamp, status, heartbeats.id) and direction can
          be either asc for ascending or desc for descending. This param can be provided
          multiple times to sort by multiple columns at the same time.'
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/heartbeat.getHeartbeatPageSuccessResponse'
        "400":
          description: Returned when a parameter couldn't be parsed.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "500":
          description: Returned when a DB interaction fails.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
      summary: Get page of heartbeats of target
      tags:
      - heartbeat
  /heartbeat/{id}/timerange:
    get:
      consumes:
      - application/json
      description: Allows to retrieve a list of heartbeats of a target that have been
        collected in the specified time range, if target is public then the info can
        be retrieved by anyone, even without an auth token. This endpoint may return
        an empty list if target is not public. The list is ordered by heartbeat's
        timestamp ascending (oldest first).
      parameters:
      - description: ID of target to get the list of heartbeats for
        in: path
        name: id
        required: true
        type: integer
      - description: Unix epoch second representing start of the time range
        in: query
        name: start
        required: true
        type: integer
      - description: Unix epoch second representing end of the time range. If not
          specified, current time is used as end timestamp of the time range.
        in: query
        name: end
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/heartbeat.getManyHeartbeatsSuccessResponse'
        "400":
          description: Returned when a parameter couldn't be parsed.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "500":
          description: Returned when a DB interaction fails.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
      summary: Get heartbeats of target in time range
      tags:
      - heartbeat

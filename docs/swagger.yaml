host: localhost:8080
info:
  contact: {}
  description: API docs for checkmate
  title: checkmate API
  version: "1.0"
paths:
  /admin/orchestrator/:
    get:
      consumes:
      - application/json
      description: Allows an admin to get a list of all orchestrators
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/orchestrator.listOrchestratorsSuccessResponse'
        "401":
          description: Returned when user sending the request supplies an invalid
            auth token.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "403":
          description: Returned when user sending the request is not an admin or their
            account is disabled.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "500":
          description: Returned when a DB interaction fails.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
      security:
      - BearerAuth: []
      summary: Get all orchestrators
      tags:
      - orchestrator
    post:
      consumes:
      - application/json
      description: Allows an admin to create a new orchestrator
      parameters:
      - description: Information about new orchestrator
        in: body
        name: createRequest
        required: true
        schema:
          $ref: '#/definitions/orchestrator.CreateOrchestratorRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/orchestrator.createOrchestratorSuccessResponse'
        "400":
          description: Returned when request body doesn't match requirements.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "401":
          description: Returned when user sending the request supplies an invalid
            auth token.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "403":
          description: Returned when user sending the request is not an admin or their
            account is disabled.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "409":
          description: Returned when given name or host is already taken.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "500":
          description: Returned when a DB interaction fails.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
      security:
      - BearerAuth: []
      summary: Create orchestrator
      tags:
      - orchestrator
  /admin/orchestrator/{id}:
    delete:
      consumes:
      - application/json
      description: Allows an admin to delete an orchestrator with given ID
      parameters:
      - description: ID of orchestrator that should get deleted
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/helpers.GenericDeleteSuccessResponse'
        "400":
          description: Returned when given ID couldn't be parsed, specified orchestrator
            is currently leader or is a system orchestrator.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "401":
          description: Returned when user sending the request supplies an invalid
            auth token.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "403":
          description: Returned when user sending the request is not an admin or their
            account is disabled.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "404":
          description: Returned when orchestrator with given ID couldn't be found.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "500":
          description: Returned when a DB interaction fails.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete orchestrator
      tags:
      - orchestrator
    get:
      consumes:
      - application/json
      description: Allows an admin to retrieve an orchestrator with given ID
      parameters:
      - description: ID of orchestrator to get
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/orchestrator.getOrchestratorSuccessResponse'
        "400":
          description: Returned when given ID couldn't be parsed.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "401":
          description: Returned when user sending the request supplies an invalid
            auth token.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "403":
          description: Returned when user sending the request is not an admin or their
            account is disabled.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "404":
          description: Returned when orchestrator with given ID couldn't be found.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "500":
          description: Returned when a DB interaction fails.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
      security:
      - BearerAuth: []
      summary: Get orchestrator by ID
      tags:
      - orchestrator
  /admin/settings/:
    get:
      consumes:
      - application/json
      description: Allows an admin to retrieve list of all settings
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/settings.listSettingsSuccessResponse'
        "401":
          description: Returned when user sending the request supplies an invalid
            auth token.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "403":
          description: Returned when user sending the request is not an admin or their
            account is disabled.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "500":
          description: Returned when a DB interaction fails.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
      security:
      - BearerAuth: []
      summary: Get all settings
      tags:
      - settings
    post:
      consumes:
      - application/json
      description: Allows an admin to set/update a setting
      parameters:
      - description: Setting to update
        in: body
        name: changeRequest
        required: true
        schema:
          $ref: '#/definitions/settings.ChangeSettingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/settings.getSettingSuccessResponse'
        "400":
          description: Returned when request body is malformed or value isn't valid
            for given setting key.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "401":
          description: Returned when user sending the request supplies an invalid
            auth token.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "403":
          description: Returned when user sending the request is not an admin, their
            account is disabled or specified setting is not meant to be updated.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "500":
          description: Returned when a DB interaction fails.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
      security:
      - BearerAuth: []
      summary: Set/modify setting value
      tags:
      - settings
  /admin/settings/{key}:
    get:
      consumes:
      - application/json
      description: Allows an admin to retrieve a setting by key
      parameters:
      - description: Setting to retrieve
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/settings.getSettingSuccessResponse'
        "401":
          description: Returned when user sending the request supplies an invalid
            auth token.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "403":
          description: Returned when user sending the request is not an admin or their
            account is disabled.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "404":
          description: Returned when a setting with given key couldn't be found.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "500":
          description: Returned when a DB interaction fails.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
      security:
      - BearerAuth: []
      summary: Get setting by key
      tags:
      - settings
  /auth/login:
    post:
      consumes:
      - application/json
      description: Allows a user with valid credentials to create a new login session
        and a token.
      parameters:
      - description: Valid credentials of user who wants to create a new session
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/auth.Credentials'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: Authentication cookie (auth-token=...)
              type: string
          schema:
            $ref: '#/definitions/auth.loginSuccessResponse'
        "400":
          description: Returned when request body does not match the requirements.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "401":
          description: Returned when supplied credentials are invalid.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "403":
          description: Returned when the user account is disabled.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
        "500":
          description: Returned when a DB interaction or token generation fails.
          schema:
            $ref: '#/definitions/helpers.GenericErrorResponse'
      summary: Log in
      tags:
      - auth
  /auth/register:
    post:
      consumes:

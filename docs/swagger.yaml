        type: number
      last_24h:
        example: 99.572
        type: number
      last_30d:
        example: 99.573
        type: number
      last_365d:
        example: 99.573
        type: number
      overall:
        example: 99.573
        type: number
    type: object
  target.createTargetSuccessResponse:
    properties:
      code:
        example: 201
        type: integer
      data:
        $ref: '#/definitions/model.Target'
    type: object
  target.getTargetReportDataSuccessResponse:
    properties:
      code:
        example: 200
        type: integer
      data:
        $ref: '#/definitions/target.ReportData'
    type: object
  target.getTargetSuccessResponse:
    properties:
      code:
        example: 200
        type: integer
      data:
        $ref: '#/definitions/model.Target'
    type: object
  target.listTargetsSuccessResponse:
    properties:
      code:
        example: 200
        type: integer
      data:
        items:
          $ref: '#/definitions/model.Target'
        type: array
    type: object
  time.Duration:
    enum:
    - 1
